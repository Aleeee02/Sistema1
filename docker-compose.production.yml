services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    environment:
      FASTAPI_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
